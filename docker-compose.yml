version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: jerseyshop-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin123}
      MYSQL_DATABASE: ${DB_NAME:-jersey}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jerseyshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jerseyshop-app
    restart: unless-stopped
    ports:
      - "9100:9100"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9100", "--reload"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://freellmapi:3001/v1}
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./templates:/app/templates
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: jerseyshop-freellmapi
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ENCRYPTION_KEY=${FREELLMAPI_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    volumes:
      - freellmapi_data:/app/data

volumes:
  mysql_data:
  freellmapi_data:

