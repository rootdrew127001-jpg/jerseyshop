<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Jersey Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin:0; overflow:hidden; }
#ui {
  position:absolute;
  top:20px;
  left:20px;
  background:white;
  padding:15px;
  border-radius:12px;
  z-index:10;
  width:220px;
}
</style>
</head>

<body>

<div id="ui">
  <h2 class="font-bold mb-2">Jersey Studio</h2>

  <label>Design:</label>
  <select id="designSelect" class="w-full mb-2">
    <option value="#4F46E5">Home (Blue)</option>
    <option value="#DC2626">Away (Red)</option>
    <option value="#16A34A">Alt (Green)</option>
    <option value="#000000">Black Mamba</option>
    <option value="#F59E0B">Gold Elite</option>
  </select>

  <label>Custom Color:</label>
  <input type="color" id="colorPicker" class="w-full mb-2">

  <label>Team Name:</label>
  <input type="text" id="textInput" placeholder="TEAM" class="w-full mb-2">

  <button onclick="applyDesign()" class="bg-indigo-600 text-white w-full py-2 rounded">
    Apply
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.5,3);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHTS
const light1 = new THREE.DirectionalLight(0xffffff,1);
light1.position.set(5,5,5);
scene.add(light1);

const light2 = new THREE.AmbientLight(0x404040,2);
scene.add(light2);

// LOAD JERSEY MODEL
let jersey;

const loader = new THREE.GLTFLoader();
loader.load('assets/models/jersey.glb', function(gltf){
  jersey = gltf.scene;
  jersey.scale.set(1.5,1.5,1.5);
  scene.add(jersey);
});

// APPLY DESIGN
function applyDesign(){
  const color = document.getElementById("designSelect").value || document.getElementById("colorPicker").value;

  jersey.traverse(child=>{
    if(child.isMesh){
      child.material.color.set(color);
    }
  });
}

// ANIMATION
function animate(){
  requestAnimationFrame(animate);
  if(jersey) jersey.rotation.y += 0.01;
  renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
