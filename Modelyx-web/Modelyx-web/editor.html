<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modelyx | 3D Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Inter', sans-serif; }
        #jerseyCanvas { display: block; }
    </style>
</head>
<body class="bg-slate-900 flex h-screen w-screen">

    <!-- Left Panel -->
    <div class="w-72 bg-slate-800 text-white flex flex-col z-10 shadow-2xl overflow-y-auto">
        <div class="p-6 border-b border-slate-700">
            <h1 class="text-xl font-black italic text-white">MODELYX.</h1>
            <p class="text-xs text-slate-400 mt-1">3D Jersey Studio</p>
        </div>

        <div class="p-6 space-y-6 flex-1">

            <!-- Random Button -->
            <button id="randomBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-2xl transition text-sm">
                🎲 Generate Random Design
            </button>

            <!-- Colors -->
            <div>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Colors</p>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-300 mb-1 block">Base Color</label>
                        <input type="color" id="baseColor" value="#4F46E5"
                            class="w-full h-10 rounded-xl border-0 cursor-pointer bg-slate-700">
                    </div>
                    <div>
                        <label class="text-xs text-slate-300 mb-1 block">Accent Color</label>
                        <input type="color" id="accentColor" value="#7C3AED"
                            class="w-full h-10 rounded-xl border-0 cursor-pointer bg-slate-700">
                    </div>
                </div>
            </div>

            <!-- Style -->
            <div>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Style</p>
                <select id="pattern"
                    class="w-full bg-slate-700 text-white text-sm rounded-xl px-4 py-3 border-0 outline-none">
                    <option value="none">No Pattern</option>
                    <option value="stripes">Stripes</option>
                    <option value="diagonal">Diagonal</option>
                    <option value="panel">Side Panels</option>
                    <option value="gradient">Gradient</option>
                </select>
            </div>

            <!-- Team Info -->
            <div>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Team Info</p>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-300 mb-1 block">Team Name</label>
                        <input type="text" id="teamName" value="TEAM" maxlength="12"
                            class="w-full bg-slate-700 text-white text-sm rounded-xl px-4 py-3 border-0 outline-none placeholder-slate-500"
                            placeholder="TEAM">
                    </div>
                    <div>
                        <label class="text-xs text-slate-300 mb-1 block">Player Number (0-99)</label>
                        <input type="number" id="number" value="23" min="0" max="99"
                            class="w-full bg-slate-700 text-white text-sm rounded-xl px-4 py-3 border-0 outline-none"
                            placeholder="23">
                    </div>
                </div>
            </div>
        </div>

        <!-- Back button -->
        <div class="p-6 border-t border-slate-700">
            <button onclick="location.href='dashboard.html'"
                class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-2xl transition text-sm">
                ← Back to Dashboard
            </button>
        </div>
    </div>

    <!-- 3D Viewport -->
    <div class="flex-1 relative">
        <canvas id="jerseyCanvas" class="w-full h-full"></canvas>
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 text-slate-500 text-xs">
            Drag to rotate · Scroll to zoom
        </div>
    </div>

    <script type="module">
        import { initEditor } from './js/editor/editor.js';
        initEditor();
    </script>
</body>
</html>
