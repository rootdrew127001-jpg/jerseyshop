<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelyx | Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
    <div class="max-w-md mx-auto px-4 py-8">
        <div class="bg-white rounded-[2.5rem] p-6 shadow-xl">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-bold">Orders</h1>
                    <p class="text-sm text-slate-500">Review your recent purchases.</p>
                </div>
                <button onclick="location.href='profile.html'" class="rounded-full border border-slate-300 bg-slate-50 px-4 py-2 text-sm font-semibold text-slate-900 hover:bg-slate-100">Back</button>
            </div>
            <div class="rounded-3xl border border-slate-200 bg-slate-50 p-6 text-center text-slate-600">
                <p class="font-semibold text-slate-900">No orders yet</p>
                <p class="text-sm mt-2">Your orders will appear here once you place them.</p>
            </div>
        </div>
    </div>
</body>
</html>
