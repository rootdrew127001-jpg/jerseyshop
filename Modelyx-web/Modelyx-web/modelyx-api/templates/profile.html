<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelyx | Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
    <div class="max-w-md mx-auto px-4 pb-20 pt-6">
        <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-200">
                <nav class="flex items-center justify-between text-sm font-semibold text-slate-500">
                    <a href="profile.html" class="text-slate-900">Profile</a>
                    <a href="orders.html" class="hover:text-slate-900">Orders</a>
                    <a href="favorites.html" class="hover:text-slate-900">Favourites</a>
                    <a href="settings.html" class="hover:text-slate-900">Settings</a>
                </nav>
            </div>
            <div class="p-6 flex gap-4">
                <div id="avatarContainer" class="h-24 w-24 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 border border-slate-200 overflow-hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
                <div class="flex-1">
                    <h1 id="welcomeName" class="text-3xl font-bold text-slate-900">Designer</h1>
                    <p id="userEmail" class="text-xs text-slate-400 mt-1">user@example.com</p>
                    <p id="memberDate" class="text-sm text-slate-500 mt-2">Modelyx Member Since April 2021</p>
                    <div class="mt-4 flex flex-wrap gap-3">
                        <button onclick="location.href='settings.html'" class="rounded-full border border-slate-300 bg-white px-6 py-3 text-sm font-semibold text-slate-900 transition hover:bg-slate-50">Edit Profile</button>
                        <button onclick="location.href='dashboard.html'" class="rounded-full bg-slate-900 px-6 py-3 text-sm font-semibold text-white transition hover:bg-slate-800">Back to Dashboard</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="editForm" class="mt-5 bg-white rounded-[2.5rem] p-6 shadow-xl">
            <div class="flex items-center justify-between mb-5">
                <div>
                    <p class="text-sm font-semibold text-slate-900">Profile Details</p>
                    <p class="text-xs text-slate-500">Update your account information.</p>
                </div>
                <button onclick="scrollToTop()" class="text-sm font-semibold text-indigo-600">Close</button>
            </div>
            <form id="profileForm" class="space-y-5">
                <div>
                    <label for="name" class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                    <input type="text" id="name" name="name" readonly class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="Your name">
                </div>
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" readonly class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="you@example.com">
                </div>
                <div>
                    <label for="address" class="block text-sm font-semibold text-slate-700 mb-2">Shipping Address</label>
                    <input type="text" id="address" name="address" readonly class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="Street address">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="city" name="city" readonly class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="City">
                    <input type="text" id="state" name="state" readonly class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="State">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="zip" name="zip" readonly class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="Zip Code">
                    <input type="text" id="country" name="country" readonly class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="Country">
                </div>
                <div>
                    <p class="text-sm font-semibold text-slate-700 mb-3">Payment Information</p>
                    <div class="space-y-4">
                        <input type="text" id="cardNumber" name="cardNumber" class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="1234 5678 9012 3456">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="month" id="expiry" name="expiry" class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
                            <input type="text" id="cvv" name="cvv" class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="CVV">
                        </div>
                    </div>
                </div>
                <button type="submit" class="w-full rounded-3xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-200 transition hover:bg-indigo-700">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const logout = () => { localStorage.clear(); location.href='index.html'; };
        const scrollToForm = () => document.getElementById('editForm').scrollIntoView({behavior:'smooth'});
        const scrollToTop = () => window.scrollTo({top:0, behavior:'smooth'});

        window.onload = () => {
            const name = localStorage.getItem('modelyx_user_name') || localStorage.getItem('modelyx_user_email')?.split('@')[0] || 'Designer';
            const email = localStorage.getItem('modelyx_user_email') || 'user@example.com';
            const created = localStorage.getItem('modelyx_user_created') || 'April 2021';
            const profileImg = localStorage.getItem('modelyx_profile_image');
            $('welcomeName').innerText = name;
            $('userEmail').innerText = email;
            $('memberDate').innerText = `Modelyx Member Since ${created}`;
            if (profileImg) {
                $('avatarContainer').innerHTML = `<img src="${profileImg}" class="w-full h-full object-cover">`;
            }
            $('name').value = localStorage.getItem('modelyx_user_name') || '';
            $('email').value = localStorage.getItem('modelyx_user_email') || '';
            $('address').value = localStorage.getItem('modelyx_shipping_address') || '';
            $('city').value = localStorage.getItem('modelyx_shipping_city') || '';
            $('state').value = localStorage.getItem('modelyx_shipping_state') || '';
            $('zip').value = localStorage.getItem('modelyx_shipping_zip') || '';
            $('country').value = localStorage.getItem('modelyx_shipping_country') || '';
            $('cardNumber').value = localStorage.getItem('modelyx_payment_card') || '';
            const expiryStored = localStorage.getItem('modelyx_payment_expiry');
            if (expiryStored && expiryStored.length === 4) {
                const mm = expiryStored.slice(0,2);
                const yy = expiryStored.slice(2,4);
                $('expiry').value = `20${yy}-${mm}`;
            } else {
                $('expiry').value = '';
            }
            $('cvv').value = localStorage.getItem('modelyx_payment_cvv') || '';
        };

        $('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const cardNumber = $('cardNumber').value.trim();
            const expiryValue = $('expiry').value;
            const cvv = $('cvv').value.trim();
            if (cardNumber) localStorage.setItem('modelyx_payment_card', cardNumber);
            if (expiryValue) {
                const [yyyy, mm] = expiryValue.split('-');
                const yy = yyyy.slice(2);
                localStorage.setItem('modelyx_payment_expiry', `${mm}${yy}`);
            }
            if (cvv) localStorage.setItem('modelyx_payment_cvv', cvv);
            alert('Payment information updated successfully!');
        });

        $('cardNumber').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9\s]/g, '');
        });
        $('cvv').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
