<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelyx | Color Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <main class="max-w-5xl mx-auto p-6 md:p-10 space-y-6">
        <header class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <p class="text-[10px] uppercase tracking-widest text-indigo-400 font-black">MODELYX Scanner</p>
                <h1 class="text-3xl font-black">Color DNA Capture</h1>
            </div>
            <button id="backBtn" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 font-bold text-sm">Back</button>
        </header>
        <section class="grid lg:grid-cols-[2fr_1fr] gap-6">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden relative">
                <video id="video" autoplay playsinline class="w-full aspect-video object-cover bg-black"></video>
                <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                    <div class="w-24 h-24 border-2 border-white/80 rounded-xl shadow-[0_0_0_9999px_rgba(0,0,0,0.15)]"></div>
                </div>
            </div>
            <aside class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5">
                <div>
                    <p class="text-[10px] uppercase tracking-widest text-slate-400 font-black">Sampled Color</p>
                    <div class="mt-3 flex items-center gap-4">
                        <div id="previewSwatch" class="w-16 h-16 rounded-2xl border border-slate-600 bg-indigo-600"></div>
                        <div>
                            <p id="previewHex" class="text-2xl font-black">#4F46E5</p>
                            <p class="text-xs text-slate-400">Center-area average (25x25)</p>
                        </div>
                    </div>
                </div>
                <div class="space-y-3">
                    <button id="captureBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 px-4 py-3 rounded-xl font-bold">Capture DNA</button>
                    <button id="saveBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 px-4 py-3 rounded-xl font-bold">Save & Return</button>
                    <button id="retryBtn" class="w-full bg-slate-800 hover:bg-slate-700 px-4 py-3 rounded-xl font-bold">Rescan</button>
                </div>
                <p id="statusText" class="text-xs text-slate-400">Point the center box at your target color, then capture.</p>
            </aside>
        </section>
    </main>
    <script>
        const $ = (id) => document.getElementById(id);
        const params = new URLSearchParams(window.location.search);
        const returnTarget = params.get('from') === 'editor'
            ? `editor.html${params.get('exit') === 'index' ? '?exit=index' : ''}`
            : 'dashboard.html';
        let stream = null;
        let currentHex = localStorage.getItem('modelyx_color') || '#4F46E5';
        const setPreview = (hex) => {
            currentHex = hex;
            $('previewSwatch').style.background = hex;
            $('previewHex').innerText = hex;
        };
        const sampleCenterAverageHex = (ctx, width, height, size = 25) => {
            const sampleSize = Math.max(3, Math.min(size, width, height));
            const x = Math.floor((width - sampleSize) / 2);
            const y = Math.floor((height - sampleSize) / 2);
            const data = ctx.getImageData(x, y, sampleSize, sampleSize).data;
            let r = 0;
            let g = 0;
            let b = 0;
            const pixelCount = data.length / 4;
            for (let i = 0; i < data.length; i += 4) {
                r += data[i];
                g += data[i + 1];
                b += data[i + 2];
            }
            const avgR = Math.round(r / pixelCount);
            const avgG = Math.round(g / pixelCount);
            const avgB = Math.round(b / pixelCount);
            return '#' + [avgR, avgG, avgB]
                .map((n) => n.toString(16).padStart(2, '0'))
                .join('')
                .toUpperCase();
        };
        const startCamera = async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                $('video').srcObject = stream;
                $('statusText').innerText = 'Camera ready. Keep the target color inside the center box.';
            } catch (err) {
                $('statusText').innerText = 'Camera access failed. Check browser permissions.';
                alert('Unable to access the camera.');
            }
        };
        const stopCamera = () => {
            stream?.getTracks().forEach((track) => track.stop());
            stream = null;
        };
        const capture = () => {
            const video = $('video');
            if (!video.videoWidth || !video.videoHeight) {
                $('statusText').innerText = 'Camera is still loading. Try again in a moment.';
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            const hex = sampleCenterAverageHex(ctx, canvas.width, canvas.height, 25);
            setPreview(hex);
            $('statusText').innerText = 'Color captured. Save when ready.';
        };
        const saveAndReturn = () => {
            localStorage.setItem('modelyx_color', currentHex);
            window.location.href = returnTarget;
        };
        $('captureBtn').addEventListener('click', capture);
        $('saveBtn').addEventListener('click', saveAndReturn);
        $('retryBtn').addEventListener('click', () => {
            $('statusText').innerText = 'Rescan ready. Capture again when centered.';
        });
        $('backBtn').addEventListener('click', () => {
            window.location.href = returnTarget;
        });
        window.addEventListener('beforeunload', stopCamera);
        setPreview(currentHex);
        startCamera();
    </script>
</body>
</html>
