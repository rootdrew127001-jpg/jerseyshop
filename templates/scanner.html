<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelyx | Color Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <main class="max-w-5xl mx-auto p-6 md:p-10 space-y-6">
        <!-- Header -->
        <header class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <p class="text-[10px] uppercase tracking-widest text-indigo-400 font-black">MODELYX Scanner</p>
                <h1 class="text-3xl font-black">Color DNA Capture</h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="backBtn" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 font-bold text-sm transition cursor-pointer">Back</button>
            </div>
        </header>

        <!-- Source Mode Switcher Bar -->
        <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-900 border border-slate-800 p-3 rounded-2xl">
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider pl-1">Input Source:</span>
                <button id="btnModeCamera" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white transition cursor-pointer">
                    <span>📷</span>
                    <span>Live Camera</span>
                </button>
                <button id="btnModeTestCard" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">
                    <span>🎨</span>
                    <span>Color Spectrum & Wheel</span>
                </button>
                <button id="btnModeUpload" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">
                    <span>📁</span>
                    <span>Upload Image</span>
                </button>
                <input type="file" id="imageFileInput" accept="image/*" class="hidden">
            </div>

            <!-- Drag & Drop / Upload hint -->
            <p id="modeBadge" class="text-[11px] font-mono text-indigo-400 bg-indigo-950/40 border border-indigo-800/40 px-2.5 py-1 rounded-lg">
                Camera Mode Active
            </p>
        </div>

        <!-- Main Scanner Grid -->
        <section class="grid lg:grid-cols-[2fr_1fr] gap-6">
            <!-- Left Viewfinder Column -->
            <div class="space-y-3">
                <div id="viewfinderWrapper" class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden relative aspect-video flex items-center justify-center cursor-crosshair select-none group shadow-2xl">
                    <!-- Video for live camera -->
                    <video id="video" autoplay playsinline class="w-full h-full object-cover bg-black"></video>

                    <!-- Canvas for test card or uploaded image -->
                    <canvas id="sampleCanvas" class="w-full h-full object-contain bg-slate-950 hidden"></canvas>

                    <!-- Interactive Reticle Box (Centered by default, moves on click/drag) -->
                    <div id="reticle" class="absolute w-20 h-20 border-2 border-white/90 rounded-2xl shadow-[0_0_0_9999px_rgba(0,0,0,0.25)] pointer-events-none transition-all duration-75 flex items-center justify-center ring-1 ring-black/40" style="left: 50%; top: 50%; transform: translate(-50%, -50%);">
                        <div class="w-2.5 h-2.5 rounded-full bg-white ring-2 ring-black/60 shadow"></div>
                        <div id="reticleBadge" class="absolute -top-6 text-[10px] font-mono font-bold bg-black/75 px-1.5 py-0.5 rounded text-white shadow pointer-events-none">COLOR DNA</div>
                    </div>

                    <!-- Reticle Help Hint Overlay -->
                    <div class="absolute bottom-3 left-3 bg-slate-950/70 backdrop-blur-sm border border-white/10 px-3 py-1 rounded-xl text-[10px] text-slate-300 pointer-events-none flex items-center gap-1.5 shadow">
                        <span>🎯</span>
                        <span>Click or drag anywhere to sample color DNA</span>
                    </div>
                </div>
            </div>

            <!-- Right Sidebar Panel -->
            <aside class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 flex flex-col justify-between">
                <div class="space-y-5">
                    <div>
                        <p class="text-[10px] uppercase tracking-widest text-slate-400 font-black">Sampled Color DNA</p>
                        <div class="mt-3 flex items-center gap-4 bg-slate-950/50 p-3 rounded-2xl border border-slate-800/80">
                            <div id="previewSwatch" class="w-16 h-16 rounded-2xl border border-slate-700 bg-indigo-600 shadow-md transition-all duration-150"></div>
                            <div>
                                <p id="previewHex" class="text-2xl font-black font-mono tracking-tight">#4F46E5</p>
                                <p id="sampleInfo" class="text-[11px] text-slate-400">Center-area average (25x25)</p>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <button id="captureBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-3 rounded-xl font-bold transition shadow-lg shadow-indigo-900/30 flex items-center justify-center gap-2 cursor-pointer">
                            <span>🎯</span>
                            <span>Capture DNA</span>
                        </button>
                        <button id="saveBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-3 rounded-xl font-bold transition shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2 cursor-pointer">
                            <span>💾</span>
                            <span>Save & Return to Editor</span>
                        </button>
                        <button id="retryBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-4 py-3 rounded-xl font-bold transition cursor-pointer">
                            Center Reticle
                        </button>
                    </div>
                </div>
            </aside>
        </section>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);
        const params = new URLSearchParams(window.location.search);
        const returnTarget = params.get('from') === 'editor'
            ? `editor.html?scanned=1${params.get('exit') === 'index' ? '&exit=index' : ''}`
            : 'dashboard.html';

        let stream = null;
        let activeMode = 'camera'; // 'camera' | 'testcard' | 'upload'
        let currentHex = localStorage.getItem('modelyx_color') || '#4F46E5';
        let reticleNormX = 0.5;
        let reticleNormY = 0.5;

        const video = $('video');
        const sampleCanvas = $('sampleCanvas');
        const reticle = $('reticle');
        const tempCanvas = document.createElement('canvas');

        const setPreview = (hex, label = 'Center-area average (25x25)') => {
            currentHex = hex.toUpperCase();
            $('previewSwatch').style.backgroundColor = currentHex;
            $('previewHex').innerText = currentHex;
            $('sampleInfo').innerText = label;
        };

        const updateStatus = (text, icon = 'ℹ️', isWarning = false) => {
            // Status feedback box removed
        };

        function hsvToRgb(h, s, v) {
            let r, g, b;
            const i = Math.floor(h * 6);
            const f = h * 6 - i;
            const p = v * (1 - s);
            const q = v * (1 - f * s);
            const t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
        }

        // Draw Interactive Chromatic Spectrum & Color Wheel
        const drawTestCard = () => {
            sampleCanvas.width = 800;
            sampleCanvas.height = 450;
            const ctx = sampleCanvas.getContext('2d');

            // 1. Dark textured canvas background
            const bgGrad = ctx.createLinearGradient(0, 0, 800, 450);
            bgGrad.addColorStop(0, '#090d16');
            bgGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 800, 450);

            // 2. Subdued cyber grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < 800; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 450); ctx.stroke();
            }
            for (let y = 0; y < 450; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke();
            }

            // 3. Pixel Buffer for smooth Chromatic Wheel and Spectrum
            const imgData = ctx.getImageData(0, 0, 800, 450);
            const data = imgData.data;

            // Geometry
            const wheelCx = 210, wheelCy = 245, wheelR = 150;
            const specX = 425, specY = 65, specW = 345, specH = 175;
            const grayX = 425, grayY = 270, grayW = 345, grayH = 36;

            // A. Draw 360° Chromatic HSV Color Wheel (Center: White, Edge: Saturated Hue)
            for (let y = wheelCy - wheelR; y <= wheelCy + wheelR; y++) {
                if (y < 0 || y >= 450) continue;
                for (let x = wheelCx - wheelR; x <= wheelCx + wheelR; x++) {
                    if (x < 0 || x >= 800) continue;
                    const dx = x - wheelCx;
                    const dy = y - wheelCy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist <= wheelR) {
                        const angle = Math.atan2(dy, dx);
                        const hue = ((angle * 180 / Math.PI) + 360) % 360;
                        const sat = Math.min(1.0, dist / wheelR);
                        const [r, g, b] = hsvToRgb(hue / 360, sat, 1.0);
                        const idx = (y * 800 + x) * 4;

                        // Smooth anti-aliased edge
                        const edgeAlpha = dist > wheelR - 1.5 ? Math.max(0, Math.min(1, (wheelR - dist) / 1.5)) : 1.0;
                        data[idx] = Math.round(r * edgeAlpha + data[idx] * (1 - edgeAlpha));
                        data[idx + 1] = Math.round(g * edgeAlpha + data[idx + 1] * (1 - edgeAlpha));
                        data[idx + 2] = Math.round(b * edgeAlpha + data[idx + 2] * (1 - edgeAlpha));
                        data[idx + 3] = 255;
                    }
                }
            }

            // B. Draw Continuous 2D Spectrum (Hue on X, Tints & Shades on Y)
            for (let y = specY; y < specY + specH; y++) {
                const relY = (y - specY) / specH;
                let sat, val;
                if (relY <= 0.5) {
                    sat = relY * 2;
                    val = 1.0;
                } else {
                    sat = 1.0;
                    val = 1.0 - (relY - 0.5) * 2;
                }
                for (let x = specX; x < specX + specW; x++) {
                    const relX = (x - specX) / specW;
                    const hue = relX * 360;
                    const [r, g, b] = hsvToRgb(hue / 360, sat, val);
                    const idx = (y * 800 + x) * 4;
                    data[idx] = r;
                    data[idx + 1] = g;
                    data[idx + 2] = b;
                    data[idx + 3] = 255;
                }
            }

            // C. Draw Monochromatic Grayscale Strip (White to Black)
            for (let y = grayY; y < grayY + grayH; y++) {
                for (let x = grayX; x < grayX + grayW; x++) {
                    const relX = (x - grayX) / grayW;
                    const val = Math.round(255 * (1.0 - relX));
                    const idx = (y * 800 + x) * 4;
                    data[idx] = val;
                    data[idx + 1] = val;
                    data[idx + 2] = val;
                    data[idx + 3] = 255;
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // 4. Overlays & Annotations
            // Top Header
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 12px Inter, system-ui, sans-serif';
            ctx.fillText('🎨 CHROMATIC COLOR WHEEL & CONTINUOUS SPECTRUM', 25, 30);
            ctx.fillStyle = '#64748b';
            ctx.font = 'normal 11px Inter, system-ui, sans-serif';
            ctx.fillText('CLICK OR DRAG THE RETICLE ANYWHERE TO SAMPLE ACCURATE COLOR DNA', 360, 30);

            // Wheel Ring Glow & Border
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(wheelCx, wheelCy, wheelR, 0, Math.PI * 2);
            ctx.stroke();

            // Wheel Cardinal Direction Markers & Tick lines
            const markers = [
                { text: 'RED 0°', angle: 0, align: 'left', baseline: 'middle', ox: 10, oy: 0 },
                { text: 'YELLOW 60°', angle: Math.PI / 3, align: 'left', baseline: 'top', ox: 8, oy: 6 },
                { text: 'GREEN 120°', angle: (2 * Math.PI) / 3, align: 'right', baseline: 'top', ox: -8, oy: 6 },
                { text: 'CYAN 180°', angle: Math.PI, align: 'right', baseline: 'middle', ox: -10, oy: 0 },
                { text: 'BLUE 240°', angle: (4 * Math.PI) / 3, align: 'right', baseline: 'bottom', ox: -8, oy: -6 },
                { text: 'MAGENTA 300°', angle: (5 * Math.PI) / 3, align: 'left', baseline: 'bottom', ox: 8, oy: -6 }
            ];

            markers.forEach(m => {
                const r1 = wheelR + 2;
                const r2 = wheelR + 8;
                const x1 = wheelCx + Math.cos(m.angle) * r1;
                const y1 = wheelCy + Math.sin(m.angle) * r1;
                const x2 = wheelCx + Math.cos(m.angle) * r2;
                const y2 = wheelCy + Math.sin(m.angle) * r2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                ctx.fillStyle = '#cbd5e1';
                ctx.font = 'bold 9px monospace';
                ctx.textAlign = m.align;
                ctx.textBaseline = m.baseline;
                ctx.fillText(m.text, x2 + m.ox, y2 + m.oy);
            });

            // Spectrum Box Border & Label
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(specX, specY, specW, specH);
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 10px Inter, system-ui, sans-serif';
            ctx.fillText('HUE & BRIGHTNESS SPECTRUM', specX, specY - 8);

            // Grayscale Box Border & Label
            ctx.strokeRect(grayX, grayY, grayW, grayH);
            ctx.fillText('WHITE TO BLACK GRADIENT', grayX, grayY - 8);

            // D. Popular Core Team Swatches
            const swatches = [
                { name: 'Gold', hex: '#FACC15' },
                { name: 'Red', hex: '#DC143C' },
                { name: 'Green', hex: '#16A34A' },
                { name: 'Cyan', hex: '#00BCD4' },
                { name: 'Royal', hex: '#2563EB' },
                { name: 'Purple', hex: '#7C3AED' },
                { name: 'Orange', hex: '#F97316' },
                { name: 'Stealth', hex: '#000000' }
            ];
            const swY = 345, swH = 55;
            const gap = 6;
            const swW = (specW - (swatches.length - 1) * gap) / swatches.length;
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('CHAMPIONSHIP PRESET SWATCHES', specX, swY - 8);

            swatches.forEach((sw, i) => {
                const sx = specX + i * (swW + gap);
                ctx.fillStyle = sw.hex;
                ctx.beginPath();
                ctx.roundRect(sx, swY, swW, swH, 8);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.stroke();

                ctx.fillStyle = sw.hex === '#000000' ? '#ffffff' : '#000000';
                ctx.font = 'bold 9px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(sw.name, sx + swW / 2, swY + swH - 10);
            });
        };

        // Draw image onto canvas
        const drawImageToCanvas = (img) => {
            sampleCanvas.width = 800;
            sampleCanvas.height = 450;
            const ctx = sampleCanvas.getContext('2d');
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, 800, 450);

            // Scale aspect-fit
            const scale = Math.min(800 / img.width, 450 / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            const x = (800 - w) / 2;
            const y = (450 - h) / 2;
            ctx.drawImage(img, x, y, w, h);
        };

        // Sample 25x25 average around (normX, normY)
        const sampleAreaHex = (normX, normY, size = null) => {
            let ctx, w, h;
            const actualSize = size !== null ? size : (activeMode === 'camera' ? 25 : 5);
            if (activeMode === 'camera' && video.videoWidth > 0) {
                tempCanvas.width = video.videoWidth;
                tempCanvas.height = video.videoHeight;
                const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
                tempCtx.drawImage(video, 0, 0);
                ctx = tempCtx;
                w = video.videoWidth;
                h = video.videoHeight;
            } else {
                ctx = sampleCanvas.getContext('2d', { willReadFrequently: true });
                w = sampleCanvas.width;
                h = sampleCanvas.height;
            }

            if (!ctx || w <= 0 || h <= 0) return currentHex;

            const centerX = Math.floor(normX * w);
            const centerY = Math.floor(normY * h);
            const half = Math.floor(actualSize / 2);
            const startX = Math.max(0, Math.min(w - actualSize, centerX - half));
            const startY = Math.max(0, Math.min(h - actualSize, centerY - half));
            const actualW = Math.min(actualSize, w - startX);
            const actualH = Math.min(actualSize, h - startY);

            if (actualW <= 0 || actualH <= 0) return currentHex;

            const imgData = ctx.getImageData(startX, startY, actualW, actualH).data;
            let r = 0, g = 0, b = 0, count = 0;
            for (let i = 0; i < imgData.length; i += 4) {
                if (imgData[i + 3] > 10) {
                    r += imgData[i];
                    g += imgData[i + 1];
                    b += imgData[i + 2];
                    count++;
                }
            }
            if (count === 0) return currentHex;
            const avgR = Math.round(r / count);
            const avgG = Math.round(g / count);
            const avgB = Math.round(b / count);
            return '#' + [avgR, avgG, avgB].map(n => n.toString(16).padStart(2, '0')).join('').toUpperCase();
        };

        const updateReticlePosition = (normX, normY, sampleNow = true) => {
            reticleNormX = Math.max(0.02, Math.min(0.98, normX));
            reticleNormY = Math.max(0.02, Math.min(0.98, normY));
            reticle.style.left = `${(reticleNormX * 100).toFixed(1)}%`;
            reticle.style.top = `${(reticleNormY * 100).toFixed(1)}%`;

            if (sampleNow) {
                const hex = sampleAreaHex(reticleNormX, reticleNormY);
                const desc = activeMode === 'camera'
                    ? `Camera Target (${Math.round(reticleNormX * 100)}%, ${Math.round(reticleNormY * 100)}%)`
                    : `Color Target (${Math.round(reticleNormX * 100)}%, ${Math.round(reticleNormY * 100)}%)`;
                setPreview(hex, desc);
            }
        };

        const stopCamera = () => {
            if (stream) {
                stream.getTracks().forEach((track) => track.stop());
                stream = null;
            }
        };

        const switchMode = (mode) => {
            activeMode = mode;
            const btnCam = $('btnModeCamera');
            const btnTest = $('btnModeTestCard');
            const btnUpload = $('btnModeUpload');

            btnCam.className = mode === 'camera'
                ? 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white transition cursor-pointer'
                : 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer';

            btnTest.className = mode === 'testcard'
                ? 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white transition cursor-pointer'
                : 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer';

            btnUpload.className = mode === 'upload'
                ? 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white transition cursor-pointer'
                : 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer';

            const badge = $('reticleBadge');
            if (mode === 'camera') {
                video.classList.remove('hidden');
                sampleCanvas.classList.add('hidden');
                $('modeBadge').innerText = 'Camera Mode Active';
                if (badge) badge.innerText = '25x25 DNA';
            } else {
                video.classList.add('hidden');
                sampleCanvas.classList.remove('hidden');
                stopCamera();
                if (badge) badge.innerText = 'COLOR DNA';
                if (mode === 'testcard') {
                    $('modeBadge').innerText = 'Color Spectrum & Wheel Active';
                    drawTestCard();
                    reticleNormX = 0.26;
                    reticleNormY = 0.54;
                    updateReticlePosition(reticleNormX, reticleNormY, true);
                } else if (mode === 'upload') {
                    $('modeBadge').innerText = 'Image Upload Mode Active';
                }
            }
        };

        const startCamera = async () => {
            switchMode('camera');
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('getUserMedia not supported');
                }
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
            } catch (err) {
                // Graceful fallback when no camera is connected or permission denied
                switchMode('testcard');
            }
        };

        // Smooth real-time pointer drag or click
        let isPointerDown = false;
        const processPointerEvent = (e) => {
            const rect = $('viewfinderWrapper').getBoundingClientRect();
            const normX = Math.max(0.02, Math.min(0.98, (e.clientX - rect.left) / rect.width));
            const normY = Math.max(0.02, Math.min(0.98, (e.clientY - rect.top) / rect.height));
            updateReticlePosition(normX, normY, true);
        };

        $('viewfinderWrapper').addEventListener('pointerdown', (e) => {
            isPointerDown = true;
            $('viewfinderWrapper').setPointerCapture?.(e.pointerId);
            processPointerEvent(e);
        });

        $('viewfinderWrapper').addEventListener('pointermove', (e) => {
            if (isPointerDown) {
                processPointerEvent(e);
            }
        });

        const releasePointer = (e) => {
            if (isPointerDown) {
                isPointerDown = false;
                $('viewfinderWrapper').releasePointerCapture?.(e.pointerId);
            }
        };
        $('viewfinderWrapper').addEventListener('pointerup', releasePointer);
        $('viewfinderWrapper').addEventListener('pointercancel', releasePointer);

        // Capture DNA button with instant tactile feedback
        $('captureBtn').addEventListener('click', () => {
            const hex = sampleAreaHex(reticleNormX, reticleNormY);
            setPreview(hex, 'Color DNA Captured & Locked');
            const originalHTML = $('captureBtn').innerHTML;
            $('captureBtn').innerHTML = '<span>✨</span><span>DNA Captured!</span>';
            $('captureBtn').classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
            $('captureBtn').classList.add('bg-emerald-600', 'hover:bg-emerald-500');
            setTimeout(() => {
                $('captureBtn').innerHTML = originalHTML;
                $('captureBtn').classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                $('captureBtn').classList.add('bg-indigo-600', 'hover:bg-indigo-500');
            }, 1200);
        });

        // Save & Return
        const saveAndReturn = () => {
            localStorage.setItem('modelyx_color', currentHex);
            window.location.href = returnTarget;
        };

        $('saveBtn').addEventListener('click', saveAndReturn);

        // Reset Reticle to Center (Wheel Center in testcard mode, Screen Center in camera mode)
        $('retryBtn').addEventListener('click', () => {
            if (activeMode === 'testcard') {
                updateReticlePosition(0.26, 0.54, true);
            } else {
                updateReticlePosition(0.5, 0.5, true);
            }
        });

        // Mode switch buttons
        $('btnModeCamera').addEventListener('click', () => {
            startCamera();
        });

        $('btnModeTestCard').addEventListener('click', () => {
            switchMode('testcard');
        });

        $('btnModeUpload').addEventListener('click', () => {
            $('imageFileInput').click();
        });

        // Handle Image File Upload
        $('imageFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    switchMode('upload');
                    drawImageToCanvas(img);
                    updateReticlePosition(0.5, 0.5, true);
                    updateStatus(`Loaded image "${file.name}". Click anywhere on the image to sample colors.`, '🖼️');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Back button
        $('backBtn').addEventListener('click', () => {
            window.location.href = params.get('from') === 'editor'
                ? `editor.html${params.get('exit') === 'index' ? '?exit=index' : ''}`
                : 'dashboard.html';
        });

        window.addEventListener('beforeunload', stopCamera);
        setPreview(currentHex);

        // Auto-start camera or gracefully fall back to test card
        startCamera();
    </script>
</body>
</html>
