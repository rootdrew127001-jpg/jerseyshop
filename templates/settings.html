<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelyx | Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/addressAutocomplete.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
    <div class="max-w-md mx-auto px-4 py-8">
        <div class="bg-white rounded-[2.5rem] p-6 shadow-xl">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-bold">Settings</h1>
                    <p class="text-sm text-slate-500">Manage your account preferences.</p>
                </div>
                <button onclick="location.href='profile.html'" class="rounded-full border border-slate-300 bg-slate-50 px-4 py-2 text-sm font-semibold text-slate-900 hover:bg-slate-100">Back</button>
            </div>
            <div class="mb-6 rounded-3xl border border-slate-200 bg-slate-50 p-5 shadow-sm">
                <div class="flex items-start gap-4">
                    <div id="summaryAvatar" class="h-16 w-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 overflow-hidden border border-slate-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </div>
                    <div class="flex-1">
                        <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Profile overview</p>
                        <h2 id="summaryName" class="text-lg font-bold text-slate-900 mt-1">Your Name</h2>
                        <p id="summaryEmail" class="text-sm text-slate-500">Your email</p>
                        <p id="summarySince" class="text-sm text-slate-500 mt-2">Member since ...</p>
                        <p id="summaryLocation" class="text-sm text-slate-500">City, Country</p>
                    </div>
                </div>
                <div class="mt-4">
                    <div class="flex items-center justify-between text-sm text-slate-500 mb-2">
                        <span>Profile completion</span>
                        <span id="completionPercent" class="font-semibold text-slate-900">0%</span>
                    </div>
                    <div class="h-2 rounded-full bg-slate-200 overflow-hidden">
                        <div id="completionBar" class="h-full rounded-full bg-indigo-600 w-0"></div>
                    </div>
                </div>
            </div>
            <form id="settingsForm" class="space-y-5">
                <div>
                    <label for="profileImage" class="block text-sm font-semibold text-slate-700 mb-2">Profile Picture</label>
                    <div class="flex items-center gap-4">
                        <div id="imagePreview" class="h-20 w-20 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 border border-slate-200 overflow-hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </div>
                        <div class="flex-1">
                            <input type="file" id="profileImage" name="profileImage" accept="image/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-3xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
                            <p class="text-xs text-slate-500 mt-1">JPG, PNG (Max 5MB)</p>
                        </div>
                    </div>
                </div>
                <div>
                    <label for="name" class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                    <input type="text" id="name" name="name" class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="Your name">
                </div>
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="you@example.com">
                </div>
                <div>
                    <label for="phone" class="block text-sm font-semibold text-slate-700 mb-2">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="09xx xxx xxxx">
                </div>
                <div>
                    <label for="address" class="block text-sm font-semibold text-slate-700 mb-2">Shipping Address</label>
                    <input type="text" id="address" name="address" class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="Street address">
                    <input type="hidden" id="latitude" name="latitude">
                    <input type="hidden" id="longitude" name="longitude">
                    <p class="mt-2 text-xs text-slate-500">Type at least 3 letters, then choose a suggested address.</p>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="city" name="city" class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="City">
                    <input type="text" id="state" name="state" class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="State">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="zip" name="zip" class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="Zip Code">
                    <input type="text" id="country" name="country" class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="Country">
                </div>
                <button type="submit" class="w-full rounded-3xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-200 transition hover:bg-indigo-700">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);

        const updateSummary = () => {
            const name = localStorage.getItem('modelyx_user_name') || '';
            const email = localStorage.getItem('modelyx_user_email') || '';
            const city = localStorage.getItem('modelyx_shipping_city') || '';
            const country = localStorage.getItem('modelyx_shipping_country') || '';
            const memberSince = localStorage.getItem('modelyx_user_created') || '';
            const profileImg = localStorage.getItem('modelyx_profile_image');

            $('summaryName').innerText = name || 'Your Name';
            $('summaryEmail').innerText = email || 'Your email';
            $('summarySince').innerText = memberSince ? `Member since ${memberSince}` : 'Member since today';
            $('summaryLocation').innerText = city || country ? `${city}${city && country ? ', ' : ''}${country}` : 'City, Country';

            if (profileImg) {
                $('summaryAvatar').innerHTML = `<img src="${profileImg}" class="w-full h-full object-cover">`;
            }

            const fields = [name, email, localStorage.getItem('modelyx_user_phone') || '', localStorage.getItem('modelyx_shipping_address') || '', city, localStorage.getItem('modelyx_shipping_state') || '', localStorage.getItem('modelyx_shipping_zip') || '', country, profileImg];
            const filled = fields.filter(value => value && value.trim()).length;
            const percent = Math.round((filled / fields.length) * 100);
            $('completionPercent').innerText = `${percent}%`;
            $('completionBar').style.width = `${percent}%`;
        };

        window.onload = () => {
            const name = localStorage.getItem('modelyx_user_name') || '';
            const email = localStorage.getItem('modelyx_user_email') || '';
            const phone = localStorage.getItem('modelyx_user_phone') || localStorage.getItem('modelyx_shipping_phone') || '';
            const address = localStorage.getItem('modelyx_shipping_address') || '';
            const city = localStorage.getItem('modelyx_shipping_city') || '';
            const state = localStorage.getItem('modelyx_shipping_state') || '';
            const zip = localStorage.getItem('modelyx_shipping_zip') || '';
            const country = localStorage.getItem('modelyx_shipping_country') || '';
            const latitude = localStorage.getItem('modelyx_shipping_latitude') || '';
            const longitude = localStorage.getItem('modelyx_shipping_longitude') || '';
            const profileImg = localStorage.getItem('modelyx_profile_image');

            $('name').value = name;
            $('email').value = email;
            $('phone').value = phone;
            $('address').value = address;
            $('city').value = city;
            $('state').value = state;
            $('zip').value = zip;
            $('country').value = country;
            $('latitude').value = latitude;
            $('longitude').value = longitude;

            if (profileImg) {
                $('imagePreview').innerHTML = `<img src="${profileImg}" class="w-full h-full object-cover">`;
            }

            updateSummary();

            AddressAutocomplete.init({
                inputId: 'address',
                cityId: 'city',
                stateId: 'state',
                zipId: 'zip',
                countryId: 'country',
                latId: 'latitude',
                lngId: 'longitude'
            });
        };

        $('profileImage').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5242880) return alert('Image must be smaller than 5MB');
            const reader = new FileReader();
            reader.onload = (event) => {
                const dataUrl = event.target.result;
                $('imagePreview').innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;
                localStorage.setItem('modelyx_profile_image', dataUrl);
            };
            reader.readAsDataURL(file);
        });

        $('settingsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = $('name').value.trim();
            const email = $('email').value.trim();
            const phone = $('phone').value.trim();
            const address = $('address').value.trim();
            const city = $('city').value.trim();
            const state = $('state').value.trim();
            const zip = $('zip').value.trim();
            const country = $('country').value.trim();
            const latitude = $('latitude').value.trim();
            const longitude = $('longitude').value.trim();

            if (name) localStorage.setItem('modelyx_user_name', name);
            if (email) localStorage.setItem('modelyx_user_email', email);
            if (phone) {
                localStorage.setItem('modelyx_user_phone', phone);
                localStorage.setItem('modelyx_shipping_phone', phone);
            }
            if (address) localStorage.setItem('modelyx_shipping_address', address);
            if (city) localStorage.setItem('modelyx_shipping_city', city);
            if (state) localStorage.setItem('modelyx_shipping_state', state);
            if (zip) localStorage.setItem('modelyx_shipping_zip', zip);
            if (country) localStorage.setItem('modelyx_shipping_country', country);
            if (latitude) localStorage.setItem('modelyx_shipping_latitude', latitude);
            if (longitude) localStorage.setItem('modelyx_shipping_longitude', longitude);

            updateSummary();
            alert('Profile information updated successfully!');
        });
    </script>
</body>
</html>
