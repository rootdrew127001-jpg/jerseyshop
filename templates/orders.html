<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelyx | My Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="location.href='/dashboard.html'"
                    class="text-slate-500 hover:text-slate-900 transition">
                    ← Back
                </button>
                <h1 class="text-xl font-black">My Orders</h1>
            </div>
            <span id="orderCount" class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full"></span>
        </div>
    </header>

    <!-- Pay Now Modal -->
    <div id="payNowModal" style="display:none"
        class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl text-center">
            <h3 class="text-xl font-black text-slate-900 mb-2">Complete Payment</h3>
            <p class="text-2xl font-black text-indigo-600 mb-6" id="payNowTotal"></p>
            <div id="paypal-now-container" class="mb-4"></div>
            <button onclick="closePayNowModal()"
                class="w-full bg-slate-100 text-slate-600 font-bold py-3 rounded-2xl text-sm mt-2">
                Cancel
            </button>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-6 py-8">

        <!-- Loading -->
        <div id="loadingState" class="text-center py-20">
            <div class="text-slate-400 text-sm">Loading orders...</div>
        </div>

        <!-- Empty -->
        <div id="emptyState" style="display:none" class="text-center py-20">
            <div class="text-5xl mb-4">📦</div>
            <h3 class="text-xl font-black text-slate-900 mb-2">No orders yet</h3>
            <p class="text-slate-500 text-sm mb-6">Design your first jersey and place an order.</p>
            <button onclick="location.href='/editor.html'"
                class="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold text-sm">
                Open 3D Studio
            </button>
        </div>

        <!-- Orders List -->
        <div id="ordersList" style="display:none" class="space-y-4"></div>

    </main>

    <script>
        const token = localStorage.getItem('modelyx_token');
        if (!token) location.href = '/index.html?redirect=orders';

        let paypalLoaded = false;
        let currentPayNowOrderId = null;
        let cachedOrders = [];

        const statusConfig = {
            'Pending Review': {
                color: 'bg-amber-100 text-amber-700',
                icon: '⏳',
                desc: 'Your order is being reviewed by our team.'
            },
            'In Production': {
                color: 'bg-blue-100 text-blue-700',
                icon: '🏭',
                desc: 'Your jersey is currently being produced.'
            },
            'Completed': {
                color: 'bg-green-100 text-green-700',
                icon: '✅',
                desc: 'Your order is complete and ready.'
            }
        };

        function paymentBadge(order) {
            let html = '';
            const hasShipping = [order.shipping_name, order.shipping_phone, order.shipping_address, order.shipping_city, order.shipping_state, order.shipping_zip, order.shipping_country, order.latitude, order.longitude].every(Boolean);

            if (order.payment_status === 'Paid') {
                html += `
                    <div class="mt-3 bg-green-500/10 border border-green-500/30 rounded-2xl p-3 flex items-center gap-2">
                        <span class="text-green-600 text-xs font-bold">✅ Payment Confirmed</span>
                        ${order.paypal_order_id ? `<span class="text-slate-400 text-xs font-mono">${order.paypal_order_id.slice(0,20)}...</span>` : ''}
                    </div>`;
            } else if (order.status !== 'Cancelled' && hasShipping) {
                html += `
                    <div class="mt-3 bg-amber-500/10 border border-amber-500/30 rounded-2xl p-4 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-amber-600">⚠️ Payment Required</p>
                            <p class="text-xs text-slate-400 mt-1">Complete payment to start production.</p>
                        </div>
                        <button onclick="payNow(${order.id}, ${order.price})"
                            class="bg-amber-500 hover:bg-amber-400 text-white font-bold px-4 py-2 rounded-xl text-xs transition">
                            Pay Now
                        </button>
                    </div>`;
            } else if (order.status !== 'Cancelled') {
                html += `
                    <div class="mt-3 bg-red-500/10 border border-red-500/30 rounded-2xl p-4">
                        <p class="text-xs font-bold text-red-500">Shipping details required before payment.</p>
                        <p class="text-xs text-slate-400 mt-1">Place a new checkout with complete delivery information.</p>
                    </div>`;
            }

            if (order.status === 'Pending Review') {
                html += `
                    <div class="mt-3">
                        <button onclick="cancelOrder(${order.id})"
                            class="w-full border border-red-200 text-red-500 hover:bg-red-50 font-bold py-2.5 rounded-2xl text-xs transition">
                            Cancel Order
                        </button>
                    </div>`;
            }

            if (order.status === 'Cancelled') {
                html += `
                    <div class="mt-3 bg-red-500/10 border border-red-500/30 rounded-2xl p-3">
                        <p class="text-red-500 text-xs font-bold">❌ Order Cancelled</p>
                        ${order.cancelled_reason ? `<p class="text-slate-400 text-xs mt-1">${order.cancelled_reason}</p>` : ''}
                    </div>`;
            }

            return html;
        }

        async function loadOrders() {
            try {
                const res = await fetch('/orders/my', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    localStorage.clear();
                    location.href = '/index.html?redirect=orders';
                    return;
                }

                const orders = await res.json();
                cachedOrders = orders;
                document.getElementById('loadingState').style.display = 'none';

                if (!orders.length) {
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }

                document.getElementById('orderCount').textContent =
                    `${orders.length} order${orders.length > 1 ? 's' : ''}`;
                document.getElementById('ordersList').style.display = 'block';
                document.getElementById('ordersList').innerHTML = orders
                    .slice()
                    .reverse()
                    .map(order => {
                        const status = statusConfig[order.status] || statusConfig['Pending Review'];
                        const date = new Date(order.created_at).toLocaleDateString('en-PH', {
                            year: 'numeric', month: 'long', day: 'numeric'
                        });
                        const total = Number(order.price || 0);
                        const shippingFee = Number(order.shipping_fee || 0);
                        const subtotal = Math.max(total - shippingFee, 0);
                        const shippingAddress = [order.shipping_address, order.shipping_city, order.shipping_state, order.shipping_zip, order.shipping_country].filter(Boolean).join(', ');

                        return `
                        <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
                            <div class="flex items-start justify-between mb-4">
                                <div>
                                    <p class="text-xs text-slate-400 font-mono">Order #${order.id}</p>
                                    <h3 class="text-lg font-black text-slate-900 mt-1">
                                        ${order.team_name || 'Custom Jersey'} #${order.player_number || '00'}
                                    </h3>
                                    <p class="text-xs text-slate-400 mt-1">${date}</p>
                                </div>
                                <span class="px-3 py-1.5 rounded-full text-xs font-bold ${status.color}">
                                    ${status.icon} ${order.status}
                                </span>
                            </div>

                            <!-- Status Timeline -->
                            <div class="flex items-center gap-2 mb-2">
                                <div class="flex-1 h-1.5 rounded-full bg-indigo-500"></div>
                                <div class="flex-1 h-1.5 rounded-full ${order.status === 'In Production' || order.status === 'Completed' ? 'bg-indigo-500' : 'bg-slate-200'}"></div>
                                <div class="flex-1 h-1.5 rounded-full ${order.status === 'Completed' ? 'bg-green-500' : 'bg-slate-200'}"></div>
                            </div>
                            <div class="flex justify-between text-[10px] text-slate-400 font-bold uppercase mb-4">
                                <span>Pending</span>
                                <span>Production</span>
                                <span>Completed</span>
                            </div>

                            <!-- Status description -->
                            <p class="text-xs text-slate-500 bg-slate-50 rounded-xl px-4 py-3 mb-4">
                                ${status.desc}
                            </p>

                            <!-- Checkout Summary -->
                            <div class="bg-slate-50 rounded-2xl p-4 mb-4">
                                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3">Checkout Summary</p>
                                <div class="grid grid-cols-2 gap-3 text-sm">
                                <div>
                                    <p class="text-xs text-slate-400">Pattern</p>
                                    <p class="font-bold capitalize">${order.pattern || 'None'}</p>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-400">Quantity</p>
                                    <p class="font-bold">${order.quantity} jersey${order.quantity > 1 ? 's' : ''}</p>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-400">Colors</p>
                                    <div class="flex items-center gap-1 mt-1">
                                        <div class="w-5 h-5 rounded-md border border-slate-200"
                                            style="background:${order.base_color}"></div>
                                        <div class="w-5 h-5 rounded-md border border-slate-200"
                                            style="background:${order.accent_color}"></div>
                                    </div>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-400">Jersey Subtotal</p>
                                    <p class="font-bold">₱${subtotal.toLocaleString()}</p>
                                </div>
                            </div>
                                <div class="mt-4 border-t border-slate-200 pt-3 space-y-2 text-sm">
                                    <div class="flex justify-between text-slate-500">
                                        <span>Shipping Fee</span>
                                        <strong class="text-slate-700">₱${shippingFee.toLocaleString()}</strong>
                                    </div>
                                    <div class="flex justify-between text-base">
                                        <span class="font-black text-slate-900">Total Paid / Due</span>
                                        <strong class="text-indigo-600">₱${total.toLocaleString()}</strong>
                                    </div>
                                </div>
                                <div class="mt-4 border-t border-slate-200 pt-3">
                                    <p class="text-xs text-slate-400">Ship To</p>
                                    <p class="text-sm font-bold text-slate-700 mt-1">${order.shipping_name || 'Recipient not set'}</p>
                                    <p class="text-xs text-slate-500">${order.shipping_phone || ''}</p>
                                    <p class="text-xs text-slate-500">${shippingAddress || 'No shipping address saved.'}</p>
                                    ${order.delivery_notes ? `<p class="text-xs text-slate-400 mt-1">${order.delivery_notes}</p>` : ''}
                                    ${order.latitude && order.longitude ? `
                                        <a href="https://www.openstreetmap.org/?mlat=${order.latitude}&mlon=${order.longitude}#map=18/${order.latitude}/${order.longitude}"
                                            target="_blank" rel="noopener"
                                            class="text-xs font-bold text-indigo-600 hover:underline mt-2 inline-block">
                                            View delivery pin
                                        </a>` : ''}
                                </div>
                            </div>

                            ${order.notes ? `
                            <div class="pt-3 border-t border-slate-100 mb-2">
                                <p class="text-xs text-slate-400">Notes</p>
                                <p class="text-sm text-slate-600 mt-1">${order.notes}</p>
                            </div>` : ''}

                            ${paymentBadge(order)}
                        </div>`;
                    }).join('');

            } catch (err) {
                document.getElementById('loadingState').innerHTML =
                    '<p class="text-red-400 text-sm">Failed to load orders. Is the server running?</p>';
            }
        }

        async function loadPayPal() {
            if (paypalLoaded) return;
            const res = await fetch('/payments/config');
            const config = await res.json();
            await new Promise((resolve, reject) => {
                if (document.getElementById('paypal-sdk')) { resolve(); return; }
                const script = document.createElement('script');
                script.id = 'paypal-sdk';
                script.src = `https://www.paypal.com/sdk/js?client-id=${config.client_id}&currency=PHP`;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
            paypalLoaded = true;
        }

        window.payNow = async function(orderId, price) {
            const order = cachedOrders.find(item => item.id === orderId);
            const hasShipping = order && [order.shipping_name, order.shipping_phone, order.shipping_address, order.shipping_city, order.shipping_state, order.shipping_zip, order.shipping_country, order.latitude, order.longitude].every(Boolean);
            if (!hasShipping) {
                alert('Please complete shipping details before payment.');
                return;
            }

            currentPayNowOrderId = orderId;
            document.getElementById('payNowTotal').textContent = `₱${Number(price).toLocaleString()}`;
            document.getElementById('payNowModal').style.display = 'flex';
            document.getElementById('paypal-now-container').innerHTML = '<p class="text-slate-400 text-sm">Loading PayPal...</p>';

            await loadPayPal();
            document.getElementById('paypal-now-container').innerHTML = '';

            paypal.Buttons({
                style: { layout: 'vertical', color: 'blue', shape: 'pill', label: 'pay' },
                createOrder: (data, actions) => {
                    return actions.order.create({
                        purchase_units: [{
                            amount: {
                                value: Number(price).toFixed(2),
                                currency_code: 'PHP'
                            },
                            description: `Modelyx Jersey Order #${orderId}`
                        }]
                    });
                },
                onApprove: async (data, actions) => {
                    const res = await fetch('/payments/capture', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            order_id: orderId,
                            paypal_order_id: data.orderID
                        })
                    });

                    if (res.ok) {
                        closePayNowModal();
                        loadOrders();
                    } else {
                        alert('Payment verification failed. Try again.');
                    }
                },
                onError: (err) => {
                    console.error('PayPal error:', err);
                    alert('Payment failed. Try again.');
                }
            }).render('#paypal-now-container');
        };

        window.closePayNowModal = function() {
            document.getElementById('payNowModal').style.display = 'none';
            document.getElementById('paypal-now-container').innerHTML = '';
        };

        loadOrders();

        window.cancelOrder = async function(orderId) {
    const reason = prompt('Reason for cancellation (optional):');
    if (reason === null) return; // User clicked Cancel on prompt

    if (!confirm(`Cancel order #${orderId}? This cannot be undone.`)) return;

    try {
        const res = await fetch(`/orders/${orderId}/cancel`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ reason: reason || 'Cancelled by customer' })
        });

        const data = await res.json();
        if (res.ok) {
            setTimeout(() => location.reload(), 500);
        } else {
            alert(data.detail || 'Failed to cancel order.');
        }
    } catch (err) {
        alert('Server error. Try again.');
    }
};

    </script>
</body>
</html>
