<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelyx | My Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="location.href='/dashboard.html'"
                    class="text-slate-500 hover:text-slate-900 transition">
                    ← Back
                </button>
                <h1 class="text-xl font-black">My Orders</h1>
            </div>
            <span id="orderCount" class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full"></span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-8">

        <!-- Loading -->
        <div id="loadingState" class="text-center py-20">
            <div class="text-slate-400 text-sm">Loading orders...</div>
        </div>

        <!-- Empty -->
        <div id="emptyState" style="display:none" class="text-center py-20">
            <div class="text-5xl mb-4">📦</div>
            <h3 class="text-xl font-black text-slate-900 mb-2">No orders yet</h3>
            <p class="text-slate-500 text-sm mb-6">Design your first jersey and place an order.</p>
            <button onclick="location.href='/editor.html'"
                class="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold text-sm">
                Open 3D Studio
            </button>
        </div>

        <!-- Orders List -->
        <div id="ordersList" style="display:none" class="space-y-4"></div>

    </main>

    <script>
        const token = localStorage.getItem('modelyx_token');
        if (!token) location.href = '/index.html';

        const statusConfig = {
            'Pending Review': {
                color: 'bg-amber-100 text-amber-700',
                icon: '⏳',
                desc: 'Your order is being reviewed by our team.'
            },
            'In Production': {
                color: 'bg-blue-100 text-blue-700',
                icon: '🏭',
                desc: 'Your jersey is currently being produced.'
            },
            'Completed': {
                color: 'bg-green-100 text-green-700',
                icon: '✅',
                desc: 'Your order is complete and ready.'
            }
        };

        async function loadOrders() {
            try {
                const res = await fetch('/orders/my', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    localStorage.clear();
                    location.href = '/index.html';
                    return;
                }

                const orders = await res.json();

                document.getElementById('loadingState').style.display = 'none';

                if (!orders.length) {
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }

                document.getElementById('orderCount').textContent = `${orders.length} order${orders.length > 1 ? 's' : ''}`;
                document.getElementById('ordersList').style.display = 'block';
                document.getElementById('ordersList').innerHTML = orders
                    .slice()
                    .reverse()
                    .map(order => {
                        const status = statusConfig[order.status] || statusConfig['Pending Review'];
                        const date = new Date(order.created_at).toLocaleDateString('en-PH', {
                            year: 'numeric', month: 'long', day: 'numeric'
                        });

                        return `
                        <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
                            <div class="flex items-start justify-between mb-4">
                                <div>
                                    <p class="text-xs text-slate-400 font-mono">Order #${order.id}</p>
                                    <h3 class="text-lg font-black text-slate-900 mt-1">
                                        ${order.team_name || 'Custom Jersey'} #${order.player_number || '00'}
                                    </h3>
                                    <p class="text-xs text-slate-400 mt-1">${date}</p>
                                </div>
                                <span class="px-3 py-1.5 rounded-full text-xs font-bold ${status.color}">
                                    ${status.icon} ${order.status}
                                </span>
                            </div>

                            <!-- Status Timeline -->
                            <div class="flex items-center gap-2 mb-4">
                                <div class="flex-1 h-1.5 rounded-full ${order.status === 'Pending Review' || order.status === 'In Production' || order.status === 'Completed' ? 'bg-indigo-500' : 'bg-slate-200'}"></div>
                                <div class="flex-1 h-1.5 rounded-full ${order.status === 'In Production' || order.status === 'Completed' ? 'bg-indigo-500' : 'bg-slate-200'}"></div>
                                <div class="flex-1 h-1.5 rounded-full ${order.status === 'Completed' ? 'bg-green-500' : 'bg-slate-200'}"></div>
                            </div>
                            <div class="flex justify-between text-[10px] text-slate-400 font-bold uppercase mb-4">
                                <span>Pending</span>
                                <span>Production</span>
                                <span>Completed</span>
                            </div>

                            <!-- Status description -->
                            <p class="text-xs text-slate-500 bg-slate-50 rounded-xl px-4 py-3 mb-4">
                                ${status.desc}
                            </p>

                            <!-- Order Details -->
                            <div class="grid grid-cols-2 gap-3 text-sm">
                                <div>
                                    <p class="text-xs text-slate-400">Pattern</p>
                                    <p class="font-bold capitalize">${order.pattern || 'None'}</p>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-400">Quantity</p>
                                    <p class="font-bold">${order.quantity} jersey${order.quantity > 1 ? 's' : ''}</p>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-400">Colors</p>
                                    <div class="flex items-center gap-1 mt-1">
                                        <div class="w-5 h-5 rounded-md border border-slate-200" style="background:${order.base_color}"></div>
                                        <div class="w-5 h-5 rounded-md border border-slate-200" style="background:${order.accent_color}"></div>
                                    </div>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-400">Total</p>
                                    <p class="font-black text-indigo-600">₱${Number(order.price).toLocaleString()}</p>
                                </div>
                            </div>

                            ${order.notes ? `
                            <div class="mt-4 pt-4 border-t border-slate-100">
                                <p class="text-xs text-slate-400">Notes</p>
                                <p class="text-sm text-slate-600 mt-1">${order.notes}</p>
                            </div>` : ''}
                        </div>
                    `;
                    }).join('');

            } catch (err) {
                document.getElementById('loadingState').innerHTML =
                    '<p class="text-red-400 text-sm">Failed to load orders. Is the server running?</p>';
            }
        }

        loadOrders();
    </script>
</body>
</html>
